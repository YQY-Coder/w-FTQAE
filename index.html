        // ================================================================
        //  🖼️  渲染函数
        // ================================================================

        function updateStats() {
            const total = appData.words.length;
            const mistakeCount = appData.mistakes.length;
            const masteredCount = appData.mastered.length;
            $('statTotal').textContent = total;
            $('statMistake').textContent = mistakeCount;
            $('statMastered').textContent = masteredCount;
            $('mistakeBadge').textContent = mistakeCount;
            $('mistakeCountLabel').textContent = `共 ${mistakeCount} 个错题`;
            $('wordCountLabel').textContent = `共 ${total} 个单词`;
            const badge = $('mistakeBadge');
            badge.style.display = mistakeCount === 0 ? 'none' : 'inline';
            badge.textContent = mistakeCount;
            // 更新批量工具栏的组选择器
            updateBatchGroupSelect();
        }

        function renderLevels() {
            const grid = $('levelGrid');
            grid.innerHTML = '';

            const mistakeCount = appData.mistakes.length;
            if (mistakeCount > 0) {
                const card = document.createElement('div');
                card.className = 'level-card mistake';
                card.innerHTML =
                    `<span class="badge-mistake">${mistakeCount}</span><span class="emoji">❌</span><div class="name">错题本</div><div class="count">${mistakeCount} 个待复习</div>`;
                card.addEventListener('click', () => startGame('mistake'));
                grid.appendChild(card);
            }

            const groups = {};
            appData.words.forEach(w => {
                const g = w.group || 'Default';
                if (!groups[g]) groups[g] = [];
                groups[g].push(w);
            });

            const groupNames = Object.keys(groups).sort();
            if (groupNames.length === 0 && mistakeCount === 0) {
                grid.innerHTML =
                    `<div class="empty-state" style="grid-column:1/-1;"><span class="big-icon">📭</span>还没有单词，去「单词管理」添加吧！</div>`;
                return;
            }

            groupNames.forEach(name => {
                const words = groups[name];
                const total = words.length;
                const mastered = words.filter(w => appData.mastered.includes(w.id)).length;
                const pct = total > 0 ? Math.round((mastered / total) * 100) : 0;
                const card = document.createElement('div');
                card.className = 'level-card';
                card.innerHTML =
                    `<span class="emoji">📘</span><div class="name">${escHtml(name)}</div><div class="count">${mastered}/${total} 已掌握</div><div class="progress-wrap"><div class="bar" style="width:${pct}%;"></div></div>`;
                card.addEventListener('click', () => startGame('group', name));
                grid.appendChild(card);
            });
        }

        function renderWordList() {
            const tbody = $('wordTableBody');
            const search = $('searchWord').value.trim().toLowerCase();
            const empty = $('wordEmpty');

            let filtered = appData.words;
            if (search) {
                filtered = filtered.filter(w => w.word.toLowerCase().includes(search) || w.meaning.includes(search));
            }

            if (filtered.length === 0) {
                tbody.innerHTML = '';
                empty.classList.remove('hidden');
                updateStats();
                updateSelectedCount();
                return;
            }
            empty.classList.add('hidden');

            tbody.innerHTML = filtered.map(w => {
                const isMistake = appData.mistakes.includes(w.id);
                const isMastered = appData.mastered.includes(w.id);
                const checked = selectedIds.has(w.id) ? 'checked' : '';
                return `
                    <tr>
                        <td style="text-align:center;width:42px;">
                            <input type="checkbox" class="batch-checkbox" data-id="${w.id}" ${checked}>
                        </td>
                        <td>
                            <strong>${escHtml(w.word)}</strong>
                            ${isMistake ? '<span class="tag-mistake">错</span>' : ''}
                            ${isMastered ? '<span class="tag-mastered">✅ 已掌握</span>' : ''}
                        </td>
                        <td>${escHtml(w.meaning)}</td>
                        <td style="color:var(--text-muted);font-size:0.85rem;">${escHtml(w.phrase || '—')}</td>
                        <td><span class="tag">${escHtml(w.group || 'Default')}</span></td>
                        <td>${isMastered ? '✅' : '⬜'}</td>
                        <td>
                            <div class="actions">
                                <button class="btn-icon ${isMastered ? 'mastered' : ''}" data-action="toggleMastered" data-id="${w.id}">
                                    ${isMastered ? '↩️ 取消' : '✅ 掌握'}
                                </button>
                                <button class="btn-icon danger" data-action="delete" data-id="${w.id}">🗑️</button>
                                ${isMistake ? `<button class="btn-icon" data-action="unmistake" data-id="${w.id}">✅ 移除错题</button>` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            // 绑定行内复选框事件
            tbody.querySelectorAll('.batch-checkbox').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const id = Number(e.target.dataset.id);
                    if (e.target.checked) selectedIds.add(id);
                    else selectedIds.delete(id);
                    updateSelectedCount();
                    syncSelectAllState();
                });
            });

            // 同步全选状态
            syncSelectAllState();
            updateSelectedCount();
            updateStats();
        }

        // 批量操作：更新选中数量
        function updateSelectedCount() {
            const count = selectedIds.size;
            $('selectedCount').textContent = count;
            // 如果有选中的，启用批量按钮；否则禁用
            const btns = ['batchDeleteBtn', 'batchMoveBtn', 'batchMasterBtn', 'batchUnmasterBtn'];
            btns.forEach(id => {
                const btn = $(id);
                if (btn) btn.disabled = count === 0;
            });
        }

        // 批量操作：全选/取消全选
        function toggleSelectAll(checked) {
            const checkboxes = document.querySelectorAll('.batch-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = checked;
                const id = Number(cb.dataset.id);
                if (checked) selectedIds.add(id);
                else selectedIds.delete(id);
            });
            // 同步表头全选状态
            const heads = document.querySelectorAll('.batch-checkbox-all');
            heads.forEach(h => h.checked = checked);
            updateSelectedCount();
        }

        // 同步全选复选框状态
        function syncSelectAllState() {
            const checkboxes = document.querySelectorAll('.batch-checkbox');
            const checkedCount = document.querySelectorAll('.batch-checkbox:checked').length;
            const allChecked = checkboxes.length > 0 && checkedCount === checkboxes.length;
            const someChecked = checkedCount > 0 && checkedCount < checkboxes.length;
            const heads = document.querySelectorAll('.batch-checkbox-all');
            heads.forEach(h => {
                h.checked = allChecked;
                h.indeterminate = someChecked;
            });
        }

        // 批量操作：获取选中的单词列表
        function getSelectedWords() {
            return appData.words.filter(w => selectedIds.has(w.id));
        }

        // 批量删除
        function batchDelete() {
            const selected = getSelectedWords();
            if (selected.length === 0) return;
            if (!confirm(`确定要删除选中的 ${selected.length} 个单词吗？此操作不可撤销！`)) return;
            const ids = selected.map(w => w.id);
            appData.words = appData.words.filter(w => !ids.includes(w.id));
            appData.mistakes = appData.mistakes.filter(id => !ids.includes(id));
            appData.mastered = appData.mastered.filter(id => !ids.includes(id));
            selectedIds.clear();
            saveData(appData);
            renderAll();
        }

        // 批量移动分组
        function batchMoveGroup() {
            const selected = getSelectedWords();
            if (selected.length === 0) return;
            const targetGroup = $('batchGroupSelect').value;
            if (!targetGroup) {
                alert('请先选择目标分组！');
                return;
            }
            if (!confirm(`将 ${selected.length} 个单词移动到「${targetGroup}」分组？`)) return;
            selected.forEach(w => w.group = targetGroup);
            selectedIds.clear();
            saveData(appData);
            renderAll();
        }

        // 批量标记掌握
        function batchMaster() {
            const selected = getSelectedWords();
            if (selected.length === 0) return;
            selected.forEach(w => {
                if (!appData.mastered.includes(w.id)) appData.mastered.push(w.id);
            });
            selectedIds.clear();
            saveData(appData);
            renderAll();
        }

        // 批量取消掌握
        function batchUnmaster() {
            const selected = getSelectedWords();
            if (selected.length === 0) return;
            selected.forEach(w => {
                const idx = appData.mastered.indexOf(w.id);
                if (idx !== -1) appData.mastered.splice(idx, 1);
            });
            selectedIds.clear();
            saveData(appData);
            renderAll();
        }

        // 更新批量操作的分组下拉菜单
        function updateBatchGroupSelect() {
            const select = $('batchGroupSelect');
            const current = select.value;
            const groups = [...new Set(appData.words.map(w => w.group || 'Default'))];
            select.innerHTML = '<option value="">移动至分组…</option>';
            groups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                select.appendChild(opt);
            });
            if (groups.includes(current)) select.value = current;
        }

        // 渲染错题本
        function renderMistakes() {
            const container = $('mistakeList');
            const empty = $('mistakeEmpty');

            const mistakeWords = appData.words.filter(w => appData.mistakes.includes(w.id));

            if (mistakeWords.length === 0) {
                container.innerHTML = '';
                empty.classList.remove('hidden');
                updateStats();
                return;
            }
            empty.classList.add('hidden');

            container.innerHTML = mistakeWords.map(w => {
                const isMastered = appData.mastered.includes(w.id);
                return `
                <div class="mistake-item">
                    <div class="info">
                        <span class="word">${escHtml(w.word)} ${isMastered ? '✅' : ''}</span>
                        <span class="meaning">${escHtml(w.meaning)}</span>
                        ${w.phrase ? `<span class="phrase">${escHtml(w.phrase)}</span>` : ''}
                        <span class="tag" style="font-size:0.7rem;">${escHtml(w.group || 'Default')}</span>
                    </div>
                    <div class="actions">
                        <button class="btn btn-outline btn-sm" data-action="unmistake" data-id="${w.id}">✅ 掌握</button>
                    </div>
                </div>
            `}).join('');

            container.querySelectorAll('[data-action="unmistake"]').forEach(btn => {
                btn.addEventListener('click', () => {
                    removeMistake(Number(btn.dataset.id));
                    renderMistakes();
                    renderLevels();
                    renderWordList();
                });
            });

            updateStats();
        }

        function updateGroupSelect() {
            const select = $('addGroup');
            const groups = [...new Set(appData.words.map(w => w.group || 'Default'))];
            const current = select.value;
            select.innerHTML = '<option value="Default">默认分组</option>';
            groups.forEach(g => {
                if (g !== 'Default') {
                    const opt = document.createElement('option');
                    opt.value = g;
                    opt.textContent = g;
                    select.appendChild(opt);
                }
            });
            if (groups.includes(current) || current === 'Default') select.value = current;
        }

        function escHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ================================================================
        //  📖  背单词模块
        // ================================================================

        function renderStudySelector() {
            const select = $('studyWordSelect');
            const currentVal = select.value;
            select.innerHTML = '<option value="">— 请选择 —</option>';
            const sorted = [...appData.words].sort((a, b) => a.word.localeCompare(b.word));
            sorted.forEach(w => {
                const opt = document.createElement('option');
                opt.value = w.id;
                opt.textContent = `${w.word} (${w.meaning})`;
                select.appendChild(opt);
            });
            if (currentVal && appData.words.some(w => String(w.id) === String(currentVal))) {
                select.value = currentVal;
            } else if (sorted.length > 0) {
                select.value = sorted[0].id;
            }
            loadStudyWord();
        }

        function loadStudyWord() {
            const container = $('studyContent');
            const select = $('studyWordSelect');
            const id = parseInt(select.value);

            if (!id || isNaN(id)) {
                container.innerHTML =
                    `<div class="study-no-word"><span class="big-icon">📖</span><p>请从上方选择一个单词开始学习</p></div>`;
                return;
            }

            const word = appData.words.find(w => w.id === id);
            if (!word) {
                container.innerHTML =
                    `<div class="study-no-word"><span class="big-icon">⚠️</span><p>单词未找到，请重新选择</p></div>`;
                return;
            }

            const lower = word.word.toLowerCase();
            const etymology = etymologyData[lower] || null;

            let etymologyHTML = '';
            if (etymology) {
                etymologyHTML = `
                    <div class="study-etymology">
                        <div class="etym-item"><strong>前缀：</strong>${escHtml(etymology.prefix.en)}（${escHtml(etymology.prefix.zh)}）</div>
                        <div class="etym-item"><strong>词根：</strong>${escHtml(etymology.root.en)}（${escHtml(etymology.root.zh)}）</div>
                    </div>
                `;
            } else {
                etymologyHTML =
                    `<div class="study-etymology"><div class="etym-item etym-empty">📝 暂无词源数据，欢迎补充！</div></div>`;
            }

            let exampleSentence = '';
            if (etymology && etymology.example) {
                exampleSentence = etymology.example;
            } else {
                const wordLower = word.word.toLowerCase();
                const subjects = ['She', 'He', 'They', 'We', 'I', 'You', 'The student', 'The teacher', 'The team'];
                const randomSubject = subjects[Math.floor(Math.random() * subjects.length)];
                const verbs = ['is', 'are', 'was', 'were', 'has', 'have', 'can', 'will', 'should'];
                const randomVerb = verbs[Math.floor(Math.random() * verbs.length)];
                const preps = ['in', 'on', 'at', 'for', 'with', 'to', 'of'];
                const prep = preps[Math.floor(Math.random() * preps.length)];
                const nouns = ['situation', 'project', 'task', 'process', 'world', 'life'];
                const noun = nouns[Math.floor(Math.random() * nouns.length)];

                const hardcoded = {
                    ability: 'She has the ability to overcome any challenge with determination.',
                    about: 'He talked about his travel experiences in detail.',
                    accept: 'She decided to accept the job offer without hesitation.',
                    achieve: 'With hard work, you can achieve your dreams.',
                    active: 'He leads an active lifestyle and exercises every day.',
                    actual: 'The actual cost of the project was much higher than expected.',
                    add: 'Please add more sugar to the recipe if you like it sweet.',
                    advantage: 'Having a good education gives you a significant advantage in life.',
                    advice: 'She gave me some excellent advice on how to improve my writing.',
                    afford: 'We can afford to buy a new car this year.',
                    afraid: 'She is afraid of speaking in public.',
                    agree: 'They finally agreed on the terms of the contract.',
                    allow: 'The school does not allow students to use phones in class.',
                    angry: 'He was angry about the unfair treatment he received.',
                    appear: 'A rainbow appeared in the sky after the rain.'
                };
                exampleSentence = hardcoded[wordLower] || `${randomSubject} ${randomVerb} ${wordLower} ${prep} the ${noun}.`;
            }

            const highlightRegex = new RegExp(`\\b${escHtml(word.word)}\\b`, 'gi');
            const highlightedSentence = escHtml(exampleSentence).replace(highlightRegex, match =>
                `<span class="highlight">${match}</span>`);
            const exampleHTML =
                `<div class="study-example"><span class="ex-label">💡 例句</span><div class="ex-sentence">${highlightedSentence}</div></div>`;

            container.innerHTML = `
                <div class="study-word-title">${escHtml(word.word)}</div>
                <div class="study-word-meta">
                    <button class="study-speak-btn" onclick="speakWord('${escHtml(word.word)}')" title="朗读单词">🔊</button>
                    <span>${escHtml(word.meaning)}</span>
                </div>
                <div class="study-divider"></div>
                ${etymologyHTML}
                ${exampleHTML}
            `;
        }

        // ================================================================
        //  📝  语法填空逻辑
        // ================================================================

        let grammarCurrentIndex = 0;
        let grammarSelected = null;
        let grammarCorrectCount = 0;
        let grammarAnswered = false;

        function renderGrammarQuestion() {
            const q = grammarQuestions[grammarCurrentIndex];
            if (!q) {
                $('grammarSentence').textContent = '所有题目已完成！';
                $('grammarOptions').innerHTML = '';
                $('grammarSubmitBtn').disabled = true;
                $('grammarFeedback').className = 'grammar-feedback';
                $('grammarFeedback').style.display = 'none';
                return;
            }

            $('grammarIndex').textContent = `第 ${grammarCurrentIndex+1} / ${grammarQuestions.length} 题`;
            $('grammarDifficulty').textContent = q.difficulty;
            $('grammarDifficulty').className = `badge-diff ${q.difficulty}`;
            $('grammarPoint').textContent = q.grammarPoint;

            let sentenceHtml = escHtml(q.sentence);
            sentenceHtml = sentenceHtml.replace(/______/g,
                '<span class="blank-highlight" id="grammarBlank">______</span>');
            $('grammarSentence').innerHTML = sentenceHtml;

            const optContainer = $('grammarOptions');
            optContainer.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.textContent = opt;
                btn.dataset.value = opt;
                btn.addEventListener('click', () => {
                    if (grammarAnswered) return;
                    optContainer.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    grammarSelected = opt;
                });
                optContainer.appendChild(btn);
            });

            grammarAnswered = false;
            grammarSelected = null;
            $('grammarSubmitBtn').disabled = false;
            $('grammarFeedback').className = 'grammar-feedback';
            $('grammarFeedback').style.display = 'none';
            $('grammarFbResult').textContent = '';
            $('grammarFbDetail').innerHTML = '';

            optContainer.querySelectorAll('.opt-btn').forEach(b => {
                b.classList.remove('correct-highlight', 'wrong-highlight', 'selected');
                b.style.cursor = 'pointer';
            });

            updateGrammarScore();
            updateEncourage();
        }

        function updateGrammarScore() {
            $('grammarTotalScore').textContent = `🏆 正确率：${grammarCorrectCount} / ${grammarQuestions.length}`;
        }

        function updateEncourage() {
            const total = grammarQuestions.length;
            const pct = total > 0 ? Math.round((grammarCorrectCount / total) * 100) : 0;
            let msg = '';
            if (pct === 100 && total > 0) msg = '🌟 完美通关！你太棒了！继续挑战更高难度吧！';
            else if (pct >= 80) msg = '👏 表现优秀！继续保持，你离语法达人越来越近！';
            else if (pct >= 60) msg = '💪 不错的成绩！多复习错题，巩固薄弱点。';
            else if (pct >= 40) msg = '📖 继续加油！建议回顾语法规则，再练一遍。';
            else msg = '🧐 别灰心！从基础开始，逐步提升。错题是最好的老师！';
            $('grammarEncourage').textContent = msg;
        }

        function handleGrammarSubmit() {
            if (grammarAnswered) return;
            const q = grammarQuestions[grammarCurrentIndex];
            if (!q) return;
            if (!grammarSelected) {
                showToast('请先选择一个答案！', 'error', 1500);
                return;
            }

            grammarAnswered = true;
            const isCorrect = grammarSelected === q.correct;
            if (isCorrect) grammarCorrectCount++;

            const optBtns = document.querySelectorAll('#grammarOptions .opt-btn');
            optBtns.forEach(btn => {
                const val = btn.dataset.value;
                if (val === q.correct) btn.classList.add('correct-highlight');
                else if (val === grammarSelected && !isCorrect) btn.classList.add('wrong-highlight');
                btn.style.cursor = 'default';
            });

            const fb = $('grammarFeedback');
            fb.className = 'grammar-feedback show';
            const result = $('grammarFbResult');
            result.textContent = isCorrect ? '✅ 回答正确！' : '❌ 回答错误';
            result.style.color = isCorrect ? 'var(--success)' : 'var(--danger)';

            $('grammarFbDetail').innerHTML = `
                <div><strong>📌 正确答案：</strong>${q.correct}</div>
                <div style="margin-top:6px;"><strong>💡 解析：</strong>${q.explanation}</div>
                <div class="rule-box"><strong>📐 语法规则：</strong>${q.rule}</div>
                <div class="example-box"><strong>📝 例句：</strong>${q.example}</div>
                <div><strong>⚠️ 常见错误：</strong>${q.commonMistake}</div>
            `;

            $('grammarSubmitBtn').disabled = true;
            updateGrammarScore();
            updateEncourage();
        }

        function nextGrammarQuestion() {
            if (grammarCurrentIndex < grammarQuestions.length - 1) {
                grammarCurrentIndex++;
                renderGrammarQuestion();
            } else {
                showToast('已经是最后一题了！', 'info', 1500);
            }
        }

        function prevGrammarQuestion() {
            if (grammarCurrentIndex > 0) {
                grammarCurrentIndex--;
                renderGrammarQuestion();
            } else {
                showToast('已经是第一题了！', 'info', 1500);
            }
        }

        function resetGrammarQuestion() {
            grammarAnswered = false;
            grammarSelected = null;
            const q = grammarQuestions[grammarCurrentIndex];
            if (!q) return;
            const optBtns = document.querySelectorAll('#grammarOptions .opt-btn');
            optBtns.forEach(btn => {
                btn.classList.remove('correct-highlight', 'wrong-highlight', 'selected');
                btn.style.cursor = 'pointer';
            });
            $('grammarSubmitBtn').disabled = false;
            $('grammarFeedback').className = 'grammar-feedback';
            $('grammarFeedback').style.display = 'none';
        }

        // ================================================================
        //  🎮  听写游戏逻辑
        // ================================================================

        function startGame(mode, groupName = '') {
            gameMode = mode;
            gameGroupName = groupName;

            if (mode === 'mistake') {
                gameQueue = appData.words.filter(w => appData.mistakes.includes(w.id));
                if (gameQueue.length === 0) {
                    showToast('🎉 错题本为空，不需要复习！', 'success');
                    return;
                }
                $('gameGroupLabel').textContent = '❌ 错题复习';
            } else {
                gameQueue = appData.words.filter(w => (w.group || 'Default') === groupName);
                if (gameQueue.length === 0) {
                    alert('该分组没有单词，请先添加。');
                    return;
                }
                $('gameGroupLabel').textContent = `📘 ${groupName}`;
            }

            gameQueue.sort(() => Math.random() - 0.5);
            gameIndex = 0;

            $('levelSelection').classList.add('hidden');
            $('gameInterface').classList.remove('hidden');

            // 隐藏提示
            $('gameHintDisplay').classList.add('hidden');
            $('hintLetters').textContent = '';

            saveSession({
                mode: gameMode,
                groupName: gameGroupName,
                queue: gameQueue.map(w => w.id),
                index: gameIndex
            });

            loadQuestion();
        }

        function loadQuestion() {
            if (gameIndex >= gameQueue.length) {
                finishGame();
                return;
            }

            const word = gameQueue[gameIndex];
            $('gameMeaning').textContent = word.meaning;
            $('gameInput').value = '';
            $('gameInput').className = '';
            $('gameInput').disabled = false;
            $('gameInput').focus();
            $('gameFeedback').className = 'game-feedback';
            $('gameFeedback').style.display = 'none';
            // 隐藏提示
            $('gameHintDisplay').classList.add('hidden');
            $('hintLetters').textContent = '';

            const total = gameQueue.length;
            const current = gameIndex + 1;
            $('gameProgressText').textContent = `${current} / ${total}`;
            $('gameProgressFill').style.width = `${(current / total) * 100}%`;

            saveSession({
                mode: gameMode,
                groupName: gameGroupName,
                queue: gameQueue.map(w => w.id),
                index: gameIndex
            });

            setTimeout(() => speakWord(word.word), 400);
        }

        function speakWord(text) {
            if (!text) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }

        // ===== 提示功能 =====
        function giveHint() {
            if (gameIndex >= gameQueue.length) return;
            const word = gameQueue[gameIndex];
            if (!word) return;
            const letters = word.word.slice(0, 3);
            const display = $('hintLetters');
            display.textContent = letters + (word.word.length > 3 ? '…' : '');
            $('gameHintDisplay').classList.remove('hidden');
            // 3秒后自动隐藏
            clearTimeout(window._hintTimer);
            window._hintTimer = setTimeout(() => {
                $('gameHintDisplay').classList.add('hidden');
            }, 5000);
        }

        function checkAnswer() {
            const input = $('gameInput');
            const userVal = input.value.trim().toLowerCase();
            const word = gameQueue[gameIndex];
            const isCorrect = userVal === word.word.toLowerCase();

            const feedback = $('gameFeedback');
            const head = $('fbHead');
            const phrase = $('fbPhrase');

            input.disabled = true;
            // 隐藏提示
            $('gameHintDisplay').classList.add('hidden');

            if (isCorrect) {
                input.className = 'correct';
                feedback.className = 'game-feedback show correct';
                head.innerHTML = '✅ 回答正确！太棒了！';
                phrase.textContent = `📖 ${word.phrase || '无短语'}`;
                if (appData.mistakes.includes(word.id)) {
                    appData.mistakes = appData.mistakes.filter(id => id !== word.id);
                    saveData(appData);
                    updateStats();
                }
            } else {
                input.className = 'wrong';
                feedback.className = 'game-feedback show wrong';
                head.innerHTML = `❌ 错误。正确答案是：<span class="fb-answer">${escHtml(word.word)}</span>`;
                phrase.textContent = `📖 ${word.phrase || '无短语'}`;
                if (!appData.mistakes.includes(word.id)) {
                    appData.mistakes.push(word.id);
                    saveData(appData);
                    updateStats();
                }
            }

            feedback.style.display = 'block';
            $('gameNextBtn').focus();

            const total = gameQueue.length;
            const done = gameIndex + 1;
            $('gameProgressFill').style.width = `${(done / total) * 100}%`;

            const masterBtn = $('gameMasterBtn');
            const isMastered = appData.mastered.includes(word.id);
            masterBtn.textContent = isMastered ? '↩️ 取消掌握' : '✅ 标记为已掌握';
            masterBtn.onclick = () => {
                toggleMastered(word.id);
                renderAll();
                const newMastered = appData.mastered.includes(word.id);
                masterBtn.textContent = newMastered ? '↩️ 取消掌握' : '✅ 标记为已掌握';
            };
        }

        function nextWord() {
            gameIndex++;
            loadQuestion();
        }

        function finishGame() {
            const total = gameQueue.length;
            const correct = gameQueue.filter(w => !appData.mistakes.includes(w.id)).length;
            const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
            let msg = '';
            if (pct === 100) msg = `🎉 完美通关！${total} 题全对！`;
            else if (pct >= 80) msg = `👏 不错！${total} 题答对 ${correct} 题（${pct}%）`;
            else if (pct >= 60) msg = `💪 完成本组！${total} 题答对 ${correct} 题（${pct}%）`;
            else msg = `📖 完成本组！${total} 题答对 ${correct} 题，继续加油！`;
            showToast(msg, pct >= 60 ? 'success' : 'info', 4000);
            clearSession();
            exitGame();
            renderLevels();
            renderMistakes();
            renderWordList();
        }

        function exitGame() {
            $('gameInterface').classList.add('hidden');
            $('levelSelection').classList.remove('hidden');
            clearSession();
            renderLevels();
            window.speechSynthesis.cancel();
        }

        function restoreSession() {
            const session = loadSession();
            if (!session) return;
            if (!session.queue || session.queue.length === 0) return;

            const validIds = session.queue.filter(id => appData.words.some(w => w.id === id));
            if (validIds.length === 0) {
                clearSession();
                return;
            }

            const confirmRestore = confirm(`您有未完成的听写（${validIds.length} 个单词），是否继续？`);
            if (!confirmRestore) {
                clearSession();
                return;
            }

            gameMode = session.mode || 'group';
            gameGroupName = session.groupName || '';
            gameQueue = validIds.map(id => appData.words.find(w => w.id === id)).filter(Boolean);
            gameIndex = Math.min(session.index || 0, gameQueue.length - 1);
            if (gameIndex < 0) gameIndex = 0;

            $('levelSelection').classList.add('hidden');
            $('gameInterface').classList.remove('hidden');
            $('gameGroupLabel').textContent = gameMode === 'mistake' ? '❌ 错题复习' : `📘 ${gameGroupName}`;
            loadQuestion();
        }

        // ================================================================
        //  🧩  操作函数
        // ================================================================

        function addWord() {
            const word = $('addWord').value.trim();
            const meaning = $('addMeaning').value.trim();
            const phrase = $('addPhrase').value.trim();
            const group = $('addGroup').value || 'Default';

            if (!word || !meaning) {
                showToast('请至少填写英文和中文释义！', 'error');
                return;
            }

            if (appData.words.some(w => w.word.toLowerCase() === word.toLowerCase())) {
                showToast('⚠️ 该单词已存在，请勿重复添加。', 'error');
                return;
            }

            appData.words.push({ id: genId(), word, meaning, phrase: phrase || '无短语', group });
            saveData(appData);
            $('addWord').value = '';
            $('addMeaning').value = '';
            $('addPhrase').value = '';
            renderAll();
        }

        function deleteWord(id) {
            if (!confirm('确定要删除这个单词吗？')) return;
            appData.words = appData.words.filter(w => w.id !== id);
            appData.mistakes = appData.mistakes.filter(mid => mid !== id);
            appData.mastered = appData.mastered.filter(mid => mid !== id);
            selectedIds.delete(id);
            saveData(appData);
            renderAll();
        }

        function removeMistake(id) {
            appData.mistakes = appData.mistakes.filter(mid => mid !== id);
            saveData(appData);
            renderAll();
        }

        function toggleMastered(id) {
            const idx = appData.mastered.indexOf(id);
            if (idx === -1) appData.mastered.push(id);
            else appData.mastered.splice(idx, 1);
            saveData(appData);
            renderAll();
        }

        function clearMistakes() {
            if (appData.mistakes.length === 0) return;
            if (!confirm('确定要清空所有错题吗？')) return;
            appData.mistakes = [];
            saveData(appData);
            renderAll();
        }

        function resetAllData() {
            if (!confirm('⚠️ 确定要重置所有数据吗？此操作不可撤销！')) return;
            if (!confirm('再次确认：所有单词、错题和掌握记录将被清除！')) return;
            appData = getDefaultData();
            selectedIds.clear();
            saveData(appData);
            clearSession();
            renderAll();
        }

        function exportJson() {
            const json = JSON.stringify(appData, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `vocab_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importJson(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.words || !Array.isArray(data.words)) throw new Error('无效的数据格式');
                    if (!confirm(`将要导入 ${data.words.length} 个单词，是否覆盖当前数据？`)) return;
                    appData.words = data.words || [];
                    appData.mistakes = data.mistakes || [];
                    appData.mastered = data.mastered || [];
                    selectedIds.clear();
                    saveData(appData);
                    clearSession();
                    renderAll();
                    showToast('✅ 数据导入成功！', 'success');
                } catch (err) {
                    alert('❌ 导入失败：' + err.message);
                }
            };
            reader.readAsText(file);
        }

        // ================================================================
        //  📄  Word / Excel 导入导出
        // ================================================================

        async function translateEnToZh(text) {
            if (!text) return '';
            try {
                const url =
                    `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|zh-CN`;
                const resp = await fetch(url);
                const data = await resp.json();
                return data.responseData?.translatedText || text;
            } catch { return text; }
        }

        async function exportToWord() {
            if (appData.words.length === 0) {
                showToast('没有单词可导出，请先添加单词。', 'error');
                return;
            }

            const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, BorderStyle } = docx;

            const rows = [
                new TableRow({
                    children: [
                        new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: '序号', bold: true })],
                                alignment: 'center' })], width: { size: 6, type: WidthType.PERCENTAGE } }),
                        new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: '英文', bold: true })],
                                alignment: 'center' })], width: { size: 20, type: WidthType.PERCENTAGE } }),
                        new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: '中文释义', bold: true })],
                                alignment: 'center' })], width: { size: 25, type: WidthType.PERCENTAGE } }),
                        new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: '短语/例句', bold: true })],
                                alignment: 'center' })], width: { size: 25, type: WidthType.PERCENTAGE } }),
                        new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: '分组', bold: true })],
                                alignment: 'center' })], width: { size: 12, type: WidthType.PERCENTAGE } }),
                        new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: '已掌握', bold: true })],
                                alignment: 'center' })], width: { size: 12, type: WidthType.PERCENTAGE } }),
                    ]
                })
            ];

            appData.words.forEach((w, index) => {
                const mastered = appData.mastered.includes(w.id) ? '✅' : '';
                rows.push(new TableRow({
                    children: [
                        new TableCell({ children: [new Paragraph({ children: [new TextRun(String(index + 1))],
                                alignment: 'center' })] }),
                        new TableCell({ children: [new Paragraph({ children: [new TextRun(w.word)], alignment: 'left' })] }),
                        new TableCell({ children: [new Paragraph({ children: [new TextRun(w.meaning)], alignment: 'left' })] }),
                        new TableCell({ children: [new Paragraph({ children: [new TextRun(w.phrase || '')],
                                alignment: 'left' })] }),
                        new TableCell({ children: [new Paragraph({ children: [new TextRun(w.group || 'Default')],
                                alignment: 'center' })] }),
                        new TableCell({ children: [new Paragraph({ children: [new TextRun(mastered)], alignment: 'center' })] }),
                    ]
                }));
            });

            const table = new Table({
                rows,
                width: { size: 100, type: WidthType.PERCENTAGE },
                borders: {
                    insideHorizontal: { style: BorderStyle.SINGLE, size: 1, color: 'CCCCCC' },
                    insideVertical: { style: BorderStyle.SINGLE, size: 1, color: 'CCCCCC' },
                    top: { style: BorderStyle.SINGLE, size: 1, color: 'CCCCCC' },
                    bottom: { style: BorderStyle.SINGLE, size: 1, color: 'CCCCCC' },
                    left: { style: BorderStyle.SINGLE, size: 1, color: 'CCCCCC' },
                    right: { style: BorderStyle.SINGLE, size: 1, color: 'CCCCCC' },
                }
            });

            const doc = new Document({
                sections: [{
                    properties: {},
                    children: [
                        new Paragraph({
                            children: [new TextRun({ text: '我的单词本', size: 36, bold: true, font: 'Arial' })],
                            alignment: 'center',
                            spacing: { after: 200 }
                        }),
                        new Paragraph({
                            children: [new TextRun({ text: `导出时间：${new Date().toLocaleString()}`, size: 18,

        async function importFromWord(file) {
            const status = $('importStatus');
            const progressWrap = $('importProgressWrap');
            const progressFill = $('importProgressFill');

            try {
                status.textContent = '📖 正在解析文档...';
                progressWrap.classList.remove('hidden');
                progressFill.style.width = '10%';

                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({ arrayBuffer });
                const rawText = result.value;

                if (!rawText.trim()) {
                    showToast('文档中未提取到任何文本内容，请检查文档格式。', 'error');
                    status.textContent = '';
                    progressWrap.classList.add('hidden');
                    return;
                }

                const lines = rawText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
                let wordsToAdd = [];
                lines.forEach(line => {
                    if (line.includes(',') || line.includes(';') || line.includes('、')) {
                        const parts = line.split(/[,;、\s]+/).filter(p => p.length > 0);
                        parts.forEach(p => { if (/[a-zA-Z]/.test(p)) wordsToAdd.push(p); });
                    } else {
                        if (/[a-zA-Z]/.test(line)) wordsToAdd.push(line);
                    }
                });

                if (wordsToAdd.length === 0) {
                    showToast('未能从文档中识别出英文单词，请确保文档包含英文内容。', 'error');
                    status.textContent = '';
                    progressWrap.classList.add('hidden');
                    return;
                }

                const uniqueWords = [];
                const seen = new Set();
                wordsToAdd.forEach(w => {
                    const lower = w.toLowerCase();
                    if (!seen.has(lower)) { seen.add(lower);
                        uniqueWords.push(w); }
                });

                status.textContent = `🔍 识别到 ${uniqueWords.length} 个英文词条，正在翻译...`;
                progressFill.style.width = '20%';

                const groupName = prompt('为这批导入的单词设置分组名称（默认：导入的单词）', '导入的单词') || '导入的单词';

                let addedCount = 0;
                const total = uniqueWords.length;

                for (let i = 0; i < total; i++) {
                    const en = uniqueWords[i];
                    if (appData.words.some(w => w.word.toLowerCase() === en.toLowerCase())) continue;
                    let meaning = en;
                    try {
                        meaning = await translateEnToZh(en);
                        await new Promise(r => setTimeout(r, 150));
                    } catch (e) { console.warn('翻译失败:', en, e); }
                    appData.words.push({ id: genId(), word: en, meaning, phrase: '', group: groupName });
                    addedCount++;
                    const percent = 20 + (i / total) * 70;
                    progressFill.style.width = `${Math.min(percent, 90)}%`;
                    status.textContent = `⏳ 正在处理 ${i+1}/${total}：${en} → ${meaning}`;
                }

                saveData(appData);
                progressFill.style.width = '100%';
                status.textContent = `✅ 导入完成！新增 ${addedCount} 个单词。`;
                renderAll();
                setTimeout(() => {
                    status.textContent = '';
                    progressWrap.classList.add('hidden');
                    progressFill.style.width = '0%';
                }, 3000);
            } catch (err) {
                console.error(err);
                alert('导入失败：' + err.message);
                status.textContent = '❌ 导入失败';
                progressWrap.classList.add('hidden');
                progressFill.style.width = '0%';
            }
        }

        async function importFromExcel(file) {
            const status = $('importStatus');
            const progressWrap = $('importProgressWrap');
            const progressFill = $('importProgressFill');

            try {
                status.textContent = '📖 正在解析 Excel 文件...';
                progressWrap.classList.remove('hidden');
                progressFill.style.width = '10%';

                const arrayBuffer = await file.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[firstSheetName];
                const rows = XLSX.utils.sheet_to_json(sheet);

                if (!rows || rows.length === 0) {
                    showToast('Excel 文件为空或无法解析。', 'error');
                    status.textContent = '';
                    progressWrap.classList.add('hidden');
                    return;
                }

                const headers = Object.keys(rows[0]);
                const findCol = (keywords) => {
                    for (const kw of keywords) {
                        const found = headers.find(h => h.trim().toLowerCase() === kw.toLowerCase());
                        if (found) return found;
                    }
                    return null;
                };

                const colWord = findCol(['英语单词', '英文', 'word']);
                const colMeaning = findCol(['中文意思', '中文', '释义', 'meaning']);
                const colPhrase = findCol(['派生词', '短语', '例句', 'phrase']);

                if (!colWord || !colMeaning) {
                    showToast('未找到必需的列："英语单词" 和 "中文意思"', 'error');
                    status.textContent = '';
                    progressWrap.classList.add('hidden');
                    return;
                }

                const items = [];
                for (const row of rows) {
                    const word = String(row[colWord] || '').trim();
                    const meaning = String(row[colMeaning] || '').trim();
                    if (word && meaning) {
                        const phrase = colPhrase ? String(row[colPhrase] || '').trim() : '';
                        items.push({ word, meaning, phrase });
                    }
                }

                if (items.length === 0) {
                    showToast('未提取到任何有效单词（需要同时有英文和中文）', 'error');
                    status.textContent = '';
                    progressWrap.classList.add('hidden');
                    return;
                }

                const uniqueMap = new Map();
                items.forEach(item => {
                    const key = item.word.toLowerCase();
                    if (!uniqueMap.has(key)) uniqueMap.set(key, item);
                });
                const uniqueItems = Array.from(uniqueMap.values());

                const groupName = prompt('为这批导入的单词设置分组名称（默认：Excel导入）', 'Excel导入') || 'Excel导入';

                let addedCount = 0;
                const total = uniqueItems.length;

                for (let i = 0; i < total; i++) {
                    const item = uniqueItems[i];
                    if (appData.words.some(w => w.word.toLowerCase() === item.word.toLowerCase())) continue;
                    appData.words.push({
                        id: genId(),
                        word: item.word,
                        meaning: item.meaning,
                        phrase: item.phrase || '无短语',
                        group: groupName
                    });
                    addedCount++;
                    const percent = 20 + (i / total) * 70;
                    progressFill.style.width = `${Math.min(percent, 90)}%`;
                    status.textContent = `⏳ 正在导入 ${i+1}/${total}：${item.word}`;
                }

                saveData(appData);
                progressFill.style.width = '100%';
                status.textContent = `✅ 导入完成！新增 ${addedCount} 个单词。`;
                renderAll();
                setTimeout(() => {
                    status.textContent = '';
                    progressWrap.classList.add('hidden');
                    progressFill.style.width = '0%';
                }, 3000);
            } catch (err) {
                console.error(err);
                alert('导入失败：' + err.message);
                status.textContent = '❌ 导入失败';
                progressWrap.classList.add('hidden');
                progressFill.style.width = '0%';
            }
        }

        // ================================================================
        //  📊  导出错题到 Excel
        // ================================================================

        function exportMistakesToExcel() {
            const mistakeWords = appData.words.filter(w => appData.mistakes.includes(w.id));
            if (mistakeWords.length === 0) {
                showToast('📭 错题本为空，没有可导出的错题。', 'error');
                return;
            }

            const sorted = [...mistakeWords].sort((a, b) => a.word.localeCompare(b.word));

            const data = sorted.map((w) => ({
                '英语单词': w.word,
                '中文意思': w.meaning,
                '短语/例句': w.phrase || '',
                '分组': w.group || 'Default',
                '已掌握': appData.mastered.includes(w.id) ? '是' : '否'
            }));

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(data);
            ws['!cols'] = [
                { wch: 20 },
                { wch: 25 },
                { wch: 32 },
                { wch: 15 },
                { wch: 12 }
            ];
            XLSX.utils.book_append_sheet(wb, ws, '错题本');
            const dateStr = new Date().toISOString().slice(0, 10);
            XLSX.writeFile(wb, `错题本_${dateStr}.xlsx`);
            showToast(`✅ 错题导出成功！共导出 ${sorted.length} 个错题。`, 'success');
        }

        // ================================================================
        //  🔄  视图切换
        // ================================================================

        function switchView(viewName) {
            $$('.view').forEach(el => el.classList.remove('active'));
            const target = $(`view${viewName.charAt(0).toUpperCase() + viewName.slice(1)}`);
            if (target) target.classList.add('active');

            $$('.nav-tabs button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.view === viewName);
            });

            if (viewName !== 'dictation') {
                if (!$('gameInterface').classList.contains('hidden')) {
                    $('gameInterface').classList.add('hidden');
                    $('levelSelection').classList.remove('hidden');
                    renderLevels();
                }
            }

            if (viewName === 'manage') {
                renderWordList();
                updateGroupSelect();
                updateBatchGroupSelect();
            } else if (viewName === 'mistakes') {
                renderMistakes();
            } else if (viewName === 'dictation') {
                renderLevels();
            } else if (viewName === 'study') {
                renderStudySelector();
            } else if (viewName === 'grammar') {
                // 仅在首次进入时初始化，不重置已有进度
                if (grammarCurrentIndex === 0 && grammarCorrectCount === 0 && !grammarAnswered) {
                    renderGrammarQuestion();
                }
            }
            updateStats();
        }

        // ================================================================
        //  🔗  事件绑定
        // ================================================================

        function initEvents() {
            $$('.nav-tabs button').forEach(btn => {
                btn.addEventListener('click', () => switchView(btn.dataset.view));
            });

            $('exitGameBtn').addEventListener('click', exitGame);
            $('gameAudioBtn').addEventListener('click', () => {
                if (gameQueue[gameIndex]) speakWord(gameQueue[gameIndex].word);
            });

            // 提示按钮
            $('gameHintBtn').addEventListener('click', giveHint);

            $('gameInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if ($('gameInput').disabled) return;
                    checkAnswer();
                }
            });
            $('gameSubmitBtn').addEventListener('click', () => {
                if ($('gameInput').disabled) return;
                checkAnswer();
            });
            $('gameNextBtn').addEventListener('click', nextWord);

            $('addWordBtn').addEventListener('click', addWord);
            ['addWord', 'addMeaning', 'addPhrase'].forEach(id => {
                $(id).addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') addWord();
                });
            });

            $('searchWord').addEventListener('input', debounce(renderWordList, 200));

            $('exportJsonBtn').addEventListener('click', exportJson);
            $('importJsonBtn').addEventListener('click', () => $('importJsonFile').click());
            $('importJsonFile').addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    importJson(e.target.files[0]);
                    e.target.value = '';
                }
            });

            $('exportWordBtn').addEventListener('click', exportToWord);
            $('importWordBtn').addEventListener('click', () => $('importWordFile').click());
            $('importWordFile').addEventListener('change', async (e) => {
                if (e.target.files.length > 0) {
                    await importFromWord(e.target.files[0]);
                    e.target.value = '';
                }
            });

            $('importExcelBtn').addEventListener('click', () => $('importExcelFile').click());
            $('importExcelFile').addEventListener('change', async (e) => {
                if (e.target.files.length > 0) {
                    await importFromExcel(e.target.files[0]);
                    e.target.value = '';
                }
            });

            $('resetAllBtn').addEventListener('click', resetAllData);

            $('reviewMistakesBtn').addEventListener('click', () => {
                const count = appData.mistakes.length;
                if (count === 0) {
                    showToast('🎉 错题本为空，无需复习！', 'success');
                    return;
                }
                switchView('dictation');
                setTimeout(() => startGame('mistake'), 150);
            });
            $('clearMistakesBtn').addEventListener('click', clearMistakes);
            $('exportMistakesBtn').addEventListener('click', exportMistakesToExcel);

            $('studyWordSelect').addEventListener('change', loadStudyWord);

            $('grammarSubmitBtn').addEventListener('click', handleGrammarSubmit);
            $('grammarNextBtn').addEventListener('click', nextGrammarQuestion);
            $('grammarPrevBtn').addEventListener('click', prevGrammarQuestion);
            $('grammarResetBtn').addEventListener('click', resetGrammarQuestion);

            // ===== 语法填空键盘快捷键 =====
            document.addEventListener('keydown', (e) => {
                if (!$('viewGrammar').classList.contains('active')) return;
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.key === 'ArrowLeft') { e.preventDefault(); prevGrammarQuestion(); }
                else if (e.key === 'ArrowRight') { e.preventDefault(); nextGrammarQuestion(); }
                else if (e.key === 'Enter' && !grammarAnswered && grammarSelected) { e.preventDefault(); handleGrammarSubmit(); }
            });

            document.getElementById('themeToggle').addEventListener('click', toggleTheme);

            // ===== 作者电话按钮 =====
            document.getElementById('phoneBtn').addEventListener('click', function() {
                const phone = '15047394626';
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(phone).then(() => {
                        alert(`📞 作者电话：${phone}\n\n✅ 已自动复制到剪贴板，可直接粘贴使用！`);
                    }).catch(() => {
                        alert(`📞 作者电话：${phone}\n\n（复制失败，请手动记录）`);
                    });
                } else {
                    alert(`📞 作者电话：${phone}\n\n（请手动复制）`);
                }
            });

            // ===== 批量操作事件 =====
            // 全选（表头和工具栏）
            document.querySelectorAll('.batch-checkbox-all').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    toggleSelectAll(e.target.checked);
                });
            });

            $('batchDeleteBtn').addEventListener('click', batchDelete);
            $('batchMoveBtn').addEventListener('click', batchMoveGroup);
            $('batchMasterBtn').addEventListener('click', batchMaster);
            $('batchUnmasterBtn').addEventListener('click', batchUnmaster);

            // ===== 单词表格事件委托（一次性绑定，避免每次渲染重新绑定） =====
            $('wordTableBody').addEventListener('click', (e) => {
                const btn = e.target.closest('[data-action]');
                if (!btn) return;
                const id = Number(btn.dataset.id);
                switch (btn.dataset.action) {
                    case 'delete': deleteWord(id); break;
                    case 'unmistake': removeMistake(id); break;
                    case 'toggleMastered': toggleMastered(id); break;
                }
            });

            // 键盘快捷键：Ctrl+A 全选 (在管理视图)
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
                    const manageView = $('viewManage');
                    if (manageView && manageView.classList.contains('active')) {
                        e.preventDefault();
                        const checked = document.querySelectorAll('.batch-checkbox:checked').length;
                        const total = document.querySelectorAll('.batch-checkbox').length;
                        const allChecked = checked === total && total > 0;
                        toggleSelectAll(!allChecked);
                    }
                }
            });
        }

        // ================================================================
        //  🚀  渲染全部 & 初始化
        // ================================================================

        function renderAll() {
            updateStats();
            // 只渲染当前可见的视图，避免不必要的 DOM 操作
            const activeView = document.querySelector('.view.active');
            if (!activeView) {
                renderLevels();
                renderWordList();
                renderMistakes();
                updateGroupSelect();
                updateBatchGroupSelect();
                return;
            }
            const viewId = activeView.id;
            if (viewId === 'viewDictation') renderLevels();
            if (viewId === 'viewManage') { renderWordList(); updateGroupSelect(); updateBatchGroupSelect(); }
            if (viewId === 'viewMistakes') renderMistakes();
            if (viewId === 'viewStudy') renderStudySelector();
            // 语法视图不重置进度
        }

        function init() {
            if (!appData.words) appData.words = [];
            if (!appData.mistakes) appData.mistakes = [];
            if (!appData.mastered) appData.mastered = [];
            saveData(appData);

            loadTheme();
            renderAll();
            initEvents();
            switchView('dictation');
            restoreSession();

            console.log('📚 单词闯关已启动！ (批量操作 + 听写提示 + 错题导出)');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
